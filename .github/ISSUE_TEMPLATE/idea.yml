name: Idea
description: Something the app or the engine could do.
title: "Idea: "
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like to do, and why. A concrete case helps more than a feature name.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another app, a workaround, or not at all. Optional.
    validations:
      required: false
