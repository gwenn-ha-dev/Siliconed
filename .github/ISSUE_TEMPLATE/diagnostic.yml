# Diagnostic report, opened by the app's Help → "Measure This Mac…", then "Open the Issue".
#
# GitHub prefills an issue form from the query string of the "new issue" URL: `template` names this
# file, `title` sets the title, and every other key is the `id` of a field below. Values are
# percent-encoded (RFC 3986). The app opens, on one line:
#
#   https://github.com/gwenn-ha-dev/Siliconed/issues/new?template=diagnostic.yml
#     &labels=diagnostic
#     &title=Diagnostic:%20Apple%20M1%20Pro%20%C2%B7%2016%20GB%20%C2%B7%20macOS%2027.0.1%20%2826A434%29
#     &chip=Apple%20M1%20Pro%20%2814-core%20GPU%29
#     &memory=16%20GB
#     &macos=27.0.1%20%2826A434%29
#     &version=0.15%20%28154%29
#     &report=%7B...%7D
#
#   template  diagnostic.yml (this file)
#   title     "Diagnostic: <chip> · <memory> · macOS <version>"
#   chip      chip name with its GPU core count (the CPU's P and E cores are in the report)
#   memory    physical memory, e.g. "16 GB"
#   macos     macOS version and build
#   version   app version and the engine's commit
#   report    the JSON report (schema 14, the machine's capacity map), only
#             if the whole URL stays under ~8 000 characters
#
# Labels come from `labels:` below; a `labels=` parameter is ignored for users without triage
# rights, so the app does not rely on it. A browser or GitHub may truncate a long URL: when the JSON
# does not fit, the app leaves `report` out, copies the JSON to the clipboard and says to paste it.
name: Diagnostic report
description: The report of the app's Help → "Measure This Mac…". One per machine and app version.
title: "Diagnostic: "
labels: [diagnostic, engine]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. These reports fill the per-chip table in docs/ENGINE.md: one machine is not a benchmark.
        The report is a map of what this Mac's GPU and CPU compute — matrix products, attention, weight
        widening — how fast, and whether each result matches the exact one; it needs no model.
        The fields below were prefilled by the app; paste the report it copied into “Report”, check, and submit.
        The report holds no image, no prompt and no file path.
  - type: input
    id: chip
    attributes:
      label: Chip
      description: Chip name and GPU cores.
      placeholder: Apple M1 Pro (14-core GPU)
    validations:
      required: true
  - type: input
    id: memory
    attributes:
      label: Memory
      placeholder: 16 GB
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS
      placeholder: 27.0.1 (26A434)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.15 (154)
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic JSON
      description: Prefilled by the app, or on your clipboard if it was too long for the link. Paste it unchanged.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Other apps running, on battery or on the power adapter, an external display. Optional.
    validations:
      required: false
