# The pure unit tests of the engine and of the app: no weights are downloaded and nothing touches the GPU.
# A version is tagged only on a commit this run found green.
name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  swift-test:
    # Xcode 27 or later: macOS 27 is the deployment target (Core AI), which an older SDK does not know. From
    # Xcode 27 GitHub names its macOS images after Xcode: `xcode-27` is macOS 27 on Apple silicon (`macos-27`
    # does not exist, and a job asking for it waits in the queue until it fails).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The runner is not the reference Mac: fewer cores, less memory. A test that depends on the machine
      # shows it here first.
      - name: Machine
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string || true
          for k in hw.memsize hw.ncpu hw.perflevel0.physicalcpu hw.perflevel1.physicalcpu; do
            printf '%s: %s\n' "$k" "$(sysctl -n "$k" 2>/dev/null || echo absent)"
          done
      - name: Swift version
        run: swift --version
      - name: Engine
        run: swift test
        working-directory: Engine
      - name: App
        run: swift test
        working-directory: App
