# The site (https://gwenn-ha-dev.github.io/Siliconed/) is `site/` as it stands in a published release:
# the page follows the versions, not every commit on main.
name: pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # `download` is GitHub's « Latest », the newest version under a tag 0.30 does not read as one (tools/release.sh):
    # the site it holds is that version's, deployed by its own `v…` release; the environment allows only `v*` anyway.
    if: github.event_name != 'release' || github.event.release.tag_name != 'download'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
